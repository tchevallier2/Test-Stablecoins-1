name: CI

# The dashboard has no build step, so CI guards the two things that actually
# break it: malformed data and a JS/HTML contract that has drifted apart.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate data.js and history.json
        run: python scripts/validate_data.py

      - name: Check the JS/HTML element contract
        run: python scripts/check_dom_contract.py

      - name: Check JavaScript syntax
        run: |
          for file in app.js charts.js data.js; do
            node --check "$file"
          done
          echo "All JavaScript parsed cleanly."
